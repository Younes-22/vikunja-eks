
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vikunja
spec:
  ingressClassName: traefik
  rules:
    - host: https://eks.labs.younesblog.org/
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vikunja
                port:
                  number: 80
