
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vikunja
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vikunja
  template:
    metadata:
      labels:
        app: vikunja
    spec:
      containers:
        - name: vikunja
          image: 667998414355.dkr.ecr.eu-west-2.amazonaws.com/vikunja:ab953ce51bb91248c17f568fef5f93ea954973cb
          ports:
            - containerPort: 3456
          env:
            - name: VIKUNJA_SERVICE_PUBLICURL
              value: "https://eks.labs.younesblog.org/"
