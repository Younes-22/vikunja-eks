
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 93.2.0
    helm:
      values: |
        prometheus:
          prometheusSpec:
            replicas: 1
            retention: 3d
            # Scrape ServiceMonitors from any namespace (e.g. Traefik)
            serviceMonitorSelectorNilUsesHelmValues: false
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                cpu: 500m
                memory: 1Gi

        grafana:
          replicas: 1
          persistence:
            enabled: false

          # Admin credentials come from a Secret created outside Git:
          # kubectl -n monitoring create secret generic grafana-admin \
          #   --from-literal=admin-user=admin \
          #   --from-literal=admin-password='<strong-password>'
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password

          # Community dashboards, downloaded at startup. Defaults from the
          # chart already cover cluster, node, namespace and pod resources.
          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
                - name: default
                  orgId: 1
                  folder: ""
                  type: file
                  disableDeletion: false
                  editable: true
                  options:
                    path: /var/lib/grafana/dashboards/default

          dashboards:
            default:
              traefik:
                gnetId: 17346
                revision: 9
                datasource: Prometheus

          grafana.ini:
            server:
              domain: grafana.labs.younesblog.org
              root_url: https://grafana.labs.younesblog.org

          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt
            hosts:
              - grafana.labs.younesblog.org
            tls:
              - secretName: grafana-tls
                hosts:
                  - grafana.labs.younesblog.org
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi

        alertmanager:
          alertmanagerSpec:
            replicas: 1
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 128Mi

        prometheusOperator:
          resources:
            requests:
              cpu: 50m
              memory: 100Mi
            limits:
              cpu: 200m
              memory: 200Mi

        kubeStateMetrics:
          enabled: true

        nodeExporter:
          enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ClientSideApplyMigration=false
