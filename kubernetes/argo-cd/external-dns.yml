
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/external-dns/
    chart: external-dns
    targetRevision: 1.23.0
    helm:
      values: |
        provider:
          name: aws

        sources:
          - service
          - ingress

        policy: upsert-only
        registry: txt
        txtOwnerId: eks-cluster

        domainFilters:
          - labs.younesblog.org

        serviceAccount:
          create: true
          name: external-dns

        extraArgs:
          aws-zone-type: public

  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
